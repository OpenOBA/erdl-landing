name: ERDL Decision Object Verification (Clean-Room)

on:
  push:
    branches: [master, main]
    paths:
      - 'vectors-v1.3/decision-object-vectors-v1.3.json'
      - 'vectors-v1.3/verify.js'
      - 'vectors-v1.3/reference-runner.js'
      - 'vectors-v1.3/ci-verify.yml'
      - 'vectors-v1.3/RUNNERS-GUIDE.md'
  pull_request:
    paths:
      - 'vectors-v1.3/**'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ═══ Step 0: Clean-room — verify no ERDL SDK is importable ═══
      - name: Clean-Room Check (SDK absence)
        working-directory: vectors-v1.3
        run: |
          if node -e "require('@openoba-ai/erdl-mcp')" 2>/dev/null; then
            echo "FAIL: ERDL SDK is importable — clean-room violation"
            exit 1
          else
            echo "PASS: ERDL SDK not importable — clean-room confirmed"
          fi

      # ═══ Step 1: Install only json-canonicalize (not ERDL SDK) ═══
      - name: Install JCS dependency (only)
        working-directory: vectors-v1.3
        run: npm install --no-save json-canonicalize

      # ═══ Step 2: Five-Step JCS+SHA-256 verification ═══
      - name: Verify v1.3 vectors (Five-Step JCS+SHA-256)
        working-directory: vectors-v1.3
        run: node verify.js decision-object-vectors-v1.3.json

      # ═══ Step 3: Generate CONFORMANCE.md artifact ═══
      - name: Generate CONFORMANCE.md
        working-directory: vectors-v1.3
        run: node verify.js decision-object-vectors-v1.3.json --output ../conformance/CONFORMANCE.md --ci

      # ═══ Step 4: Upload conformance artifact ═══
      - name: Upload CONFORMANCE.md
        uses: actions/upload-artifact@v4
        with:
          name: conformance-report
          path: conformance/CONFORMANCE.md
