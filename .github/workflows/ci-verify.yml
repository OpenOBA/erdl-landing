name: ERDL Decision Object Verification
on:
  push:
    branches: [master, main]
    paths:
      - 'vectors-v1.3/decision-object-vectors-v1.3.json'
      - 'vectors-v1.3/verify.js'
      - 'vectors-v1.3/reference-runner.js'
      - 'vectors-v1.3/ci-verify.yml'
      - 'vectors-v1.3/RUNNERS-GUIDE.md'
  pull_request:
    paths:
      - 'vectors-v1.3/**'
      - 'submissions/*.json'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify v1.3 vectors
        working-directory: vectors-v1.3
        run: node verify.js decision-object-vectors-v1.3.json

      - name: Cross-verify runner submissions (if any)
        if: hashFiles('submissions/*.json') != ''
        working-directory: vectors-v1.3
        run: |
          for f in ../submissions/*.json; do
            [ -f "$f" ] || continue
            echo "Checking: $f"
            node verify.js decision-object-vectors-v1.3.json "$f"
          done
