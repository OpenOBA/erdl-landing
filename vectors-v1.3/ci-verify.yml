name: ERDL Decision Object Dual Verification (Clean-Room)

on:
  push:
    branches: [master, main]
    paths:
      - 'vectors-v1.3/decision-object-vectors-v1.3.json'
      - 'vectors-v1.3/verify.js'
      - 'vectors-v1.3/reference-runner.js'
      - 'vectors-v1.3/ci-verify.yml'
      - 'vectors-v1.3/RUNNERS-GUIDE.md'
  pull_request:
    paths:
      - 'vectors-v1.3/**'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ═══ Step 0: Clean-room — verify no ERDL SDK is importable ═══
      - name: Clean-Room Check (SDK absence)
        working-directory: vectors-v1.3
        run: |
          if node -e "require('@openoba-ai/erdl-mcp')" 2>/dev/null; then
            echo "FAIL: ERDL SDK is importable — clean-room violation"
            exit 1
          else
            echo "PASS: ERDL SDK not importable — clean-room confirmed"
          fi

      # ═══ Step 1: Install JCS dependency (only) ═══
      - name: Install JCS dependency (only)
        working-directory: vectors-v1.3
        run: npm install --no-save json-canonicalize

      # ═══ Step 2: Check 1 — Audit Hash Self-Consistency (Five-Step JCS+SHA-256) ═══
      - name: Check 1 — Audit Hash Self-Consistency
        working-directory: vectors-v1.3
        run: node verify.js decision-object-vectors-v1.3.json

      # ═══ Step 3: Check 2 — Answers File Cross-Comparison (independent oracle) ═══
      # Compares recomputed canonical bytes against the pre-generated answers file.
      # Catches runners that pass Check 1 but produce incorrect canonical bytes.
      # AV-013: Check 2 SHOULD MATCH (correct runner's canonical bytes match answers file)
      #   while Check 1 MISMATCHES (stored hash is the regressed one) — canary correctly discriminates.
      - name: Check 2 — Answers File Cross-Comparison
        working-directory: vectors-v1.3
        run: node verify.js decision-object-vectors-v1.3.json --answers decision-object-answers-v1.3.json

      # ═══ Step 4: Generate CONFORMANCE.md (dual verification) ═══
      - name: Generate CONFORMANCE.md (dual verification)
        working-directory: vectors-v1.3
        run: node verify.js decision-object-vectors-v1.3.json --answers decision-object-answers-v1.3.json --ci

      # ═══ Step 5: Upload conformance artifact ═══
      - name: Upload CONFORMANCE.md
        uses: actions/upload-artifact@v4
        with:
          name: conformance-report
          path: vectors-v1.3/conformance/CONFORMANCE.md
