name: ERDL Decision Object Dual Verification (Clean-Room)

on:
  push:
    branches: [master, main]
    paths:
      - 'vectors-v1.3/decision-object-vectors-v1.3.json'
      - 'vectors-v1.3/verify.js'
      - 'vectors-v1.3/reference-runner.js'
      - 'vectors-v1.3/ci-verify.yml'
      - 'vectors-v1.3/RUNNERS-GUIDE.md'
  pull_request:
    paths:
      - 'vectors-v1.3/**'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clean-Room Check (SDK absence)
        working-directory: vectors-v1.3
        run: |
          if node -e "require('@openoba-ai/erdl-mcp')" 2>/dev/null; then
            echo "FAIL: ERDL SDK is importable"
            exit 1
          else
            echo "PASS: ERDL SDK not importable"
          fi

      - name: Install JCS dependency
        working-directory: vectors-v1.3
        run: npm install --no-save json-canonicalize

      - name: Check 1 - Audit Hash Self-Consistency
        working-directory: vectors-v1.3
        run: node verify.js decision-object-vectors-v1.3.json

      - name: Check 2 - Answers File Cross-Comparison
        working-directory: vectors-v1.3
        run: |
          if [ -f decision-object-answers-v1.3.json ]; then
            node verify.js decision-object-vectors-v1.3.json --answers decision-object-answers-v1.3.json
          else
            echo "WARNING: Answers file not found - skipping Check 2 (answers file is local-only, never committed)"
          fi

      - name: Generate CONFORMANCE.md
        working-directory: vectors-v1.3
        run: |
          if [ -f decision-object-answers-v1.3.json ]; then
            node verify.js decision-object-vectors-v1.3.json --answers decision-object-answers-v1.3.json --ci
          else
            node verify.js decision-object-vectors-v1.3.json --ci
          fi

      - name: Upload CONFORMANCE.md
        uses: actions/upload-artifact@v4
        with:
          name: conformance-report
          path: vectors-v1.3/conformance/CONFORMANCE.md
